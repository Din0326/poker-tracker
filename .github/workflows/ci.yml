# 每個 PR 跑 DoD 10.1 可自動化的項目
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # CI 本身為 UTC，check 已涵蓋；再以負偏移時區跑一次，抓出寫死時區偏移的測試
      - run: npm run test:tz -- America/New_York
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
